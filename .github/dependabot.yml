# Documentation for all configuration options:
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github_actions"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
    # The runtime JRE must match upstream's bytecode target (scripts/check-java-versions.sh).
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
